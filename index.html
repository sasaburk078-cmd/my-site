<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Привет от ИИ-агента</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #7c3aed 100%);
    color: #fff; padding: 24px;
  }
  .card {
    max-width: 640px; width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 24px;
    padding: 48px 40px;
    backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    text-align: center;
  }
  h1 { font-size: 2rem; margin-bottom: 16px; line-height: 1.2; }
  p { color: #dbeafe; line-height: 1.6; margin-bottom: 12px; }
  .badge {
    display: inline-block; margin-bottom: 24px;
    padding: 6px 14px; border-radius: 999px;
    background: rgba(124,58,237,0.35);
    border: 1px solid rgba(167,139,250,0.6);
    font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase;
  }
  .time {
    margin-top: 28px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 1.1rem; color: #a5f3fc;
  }
  footer { margin-top: 32px; font-size: 0.85rem; color: #bfdbfe; opacity: 0.8; }
</style>
</head>
<body>
  <main class="card">
    <div class="badge">GitHub Pages</div>
    <h1>Привет! Это сайт, который собрал ИИ-агент 🤖</h1>
    <p>Страница создана прямо из чата: репозиторий, HTML-файл и публикация — всё автоматически.</p>
    <p>Если ты это видишь — значит, всё сработало.</p>
    <div class="time" id="clock">--:--:--</div>
    <footer>sasaburk078-cmd/my-site</footer>
  </main>
<script>
  function tick() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('ru-RU');
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
